<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{ title }}</title>
<style>
  body { margin: 0; padding: 0; background: #f4f5f7; }
  .card { background: #ffffff; color: #1b1f24; }
  .muted { color: #5b6470; }
  .code { background: #eef2ff; color: #1b1f24; }
  @media (prefers-color-scheme: dark) {
    body { background: #14171c !important; }
    .card { background: #1d2127 !important; color: #eceff3 !important; }
    .muted { color: #a3acb8 !important; }
    .code { background: #2a3140 !important; color: #ffffff !important; }
    a { color: #8fb4ff !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;">
<tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="card" style="max-width:480px;background:#ffffff;color:#1b1f24;border-radius:12px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;">
  <tr><td style="padding:28px 28px 8px;">
    <p style="margin:0 0 4px;font-size:14px;font-weight:600;letter-spacing:.02em;" class="muted">{{ site_name }}</p>
    <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;">{{ title }}</h1>
    <p style="margin:0 0 16px;">Здравствуйте, {{ name }}!</p>
    <p style="margin:0 0 12px;">{{ lead }}</p>
    <p class="code" style="margin:0 0 16px;padding:16px;border-radius:10px;background:#eef2ff;color:#1b1f24;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:.35em;">{{ code }}</p>
    <p style="margin:0 0 12px;">Код действует {{ ttl_minutes }} минут и подходит один раз. Никому не сообщайте его: сотрудники сайта код не спрашивают.</p>
    {% block extra %}{% endblock %}
    <p class="muted" style="margin:0 0 20px;font-size:14px;color:#5b6470;">{{ ignore }}</p>
  </td></tr>
  <tr><td style="padding:0 28px 24px;font-size:13px;" class="muted"><a href="{{ site_url }}" style="color:#2f5bd8;">{{ site_url }}</a></td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
