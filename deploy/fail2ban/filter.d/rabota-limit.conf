# Срабатывает, когда nginx отклоняет запросы посетителя по лимитам входа, форм и страниц (журнал rabota.error.log).
# Пример строки: ... [error] ... limiting requests, excess: 5.480 by zone "rabota_auth", client: 203.0.113.7, server: ...
[Definition]
failregex = limiting requests, excess: [\d.]+ by zone "rabota_(?:auth|forms|pages)", client: <HOST>,
ignoreregex =
