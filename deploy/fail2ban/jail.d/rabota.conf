# Блокировка адресов, которые долго упираются в лимиты сайта. Необязательно; включить: enabled = true, затем
#   sudo systemctl reload fail2ban
# Адрес берётся из PROXY-заголовка Xray, поэтому в журнале nginx настоящий адрес посетителя.
[rabota-limit]
enabled  = false
filter   = rabota-limit
logpath  = /var/log/nginx/rabota.error.log
port     = http,https
maxretry = 30
findtime = 10m
bantime  = 1h
