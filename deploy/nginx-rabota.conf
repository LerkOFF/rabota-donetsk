# Виртуальный хост сайта работа-донецк.рф для сервера, где публичный порт 443 держит Xray.
#
# Схема: Xray терминирует TLS по SNI и по fallback отдаёт соединения в nginx без TLS с заголовком PROXY v2:
#   127.0.0.1:8081  HTTP/2 (alpn h2)
#   127.0.0.1:8082  остальное (HTTP/1.1)
# Порт 80 держит nginx: проверка Let's Encrypt и редирект на https.
# Реальный адрес посетителя берётся из PROXY (real_ip_header proxy_protocol), поэтому limit_req и журнал видят клиента.
#
# Установка (делает scripts/bootstrap-server.sh):
#   sed 's#<PROJECT_DIR>#/var/www/rabota#g' deploy/nginx-rabota.conf | sudo tee /etc/nginx/sites-available/site-rabota
#   sudo ln -s /etc/nginx/sites-available/site-rabota /etc/nginx/sites-enabled/site-rabota
#   sudo nginx -t && sudo systemctl reload nginx
# Имя файла начинается на site-: у портов нет default_server, первым должен грузиться vhost метрики.
# Строки listen ниже должны совпадать с остальными vhost сервера (проверьте по соседнему файлу, например site-svet-donetsk).
# Сжатие gzip включено глобально в conf.d/metrika-gzip.conf и здесь не дублируется.
# Зоны limit_req и map имеют префикс rabota_, чтобы не пересекаться с другими сайтами.

# ---------------------------------------------------------------- общие настройки (контекст http)

# ключ лимита только для POST: GET-запросы в эти зоны не попадают (пустой ключ не учитывается)
map $request_method $rabota_post_key {
    default "";
    POST    $binary_remote_addr;
}

# версионированная статика (?v=...) не меняется под этим адресом: год; без версии: неделя
map $arg_v $rabota_static_cache {
    default "public, max-age=604800";
    "~.+"   "public, max-age=31536000, immutable";
}

limit_req_zone $rabota_post_key       zone=rabota_auth:2m   rate=10r/m;   # вход, регистрация, сброс пароля
limit_req_zone $rabota_post_key       zone=rabota_forms:2m  rate=30r/m;   # отклики, жалобы, обращения, сообщения, кабинет
limit_req_zone $binary_remote_addr    zone=rabota_pages:10m rate=20r/s;   # общая защита от переборов страниц
limit_req_zone $binary_remote_addr    zone=rabota_health:1m rate=12r/m;   # /healthz/deep для внешнего мониторинга

upstream rabota_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

# ---------------------------------------------------------------- порт 80: ACME и редирект

server {
    listen 80;
    listen [::]:80;
    server_name xn----7sbadrg9awfdp1a2d.xn--p1ai www.xn----7sbadrg9awfdp1a2d.xn--p1ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://xn----7sbadrg9awfdp1a2d.xn--p1ai$request_uri;
    }
}

# ---------------------------------------------------------------- www -> без www (после Xray)

server {
    listen 127.0.0.1:8081 proxy_protocol http2;
    listen 127.0.0.1:8082 proxy_protocol;
    server_name www.xn----7sbadrg9awfdp1a2d.xn--p1ai;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://xn----7sbadrg9awfdp1a2d.xn--p1ai$request_uri;
}

# ---------------------------------------------------------------- основной сайт

server {
    listen 127.0.0.1:8081 proxy_protocol http2;
    listen 127.0.0.1:8082 proxy_protocol;
    server_name xn----7sbadrg9awfdp1a2d.xn--p1ai;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    access_log /var/log/nginx/rabota.access.log;
    error_log  /var/log/nginx/rabota.error.log warn;

    client_max_body_size 10m;
    client_body_timeout 15s;
    limit_req_status 429;

    # HSTS и nosniff выставляет nginx (копии из ответа приложения скрыты ниже), остальные заголовки безопасности даёт приложение
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # страницы ошибок, когда приложение не отвечает
    error_page 502 503 504 /rabota-50x.html;
    location = /rabota-50x.html {
        internal;
        root <PROJECT_DIR>/deploy/errors;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # скрытые файлы (.git, .env) наружу не отдаём
    location ~ /\. {
        return 404;
    }

    # статика напрямую с диска
    location /static/ {
        alias <PROJECT_DIR>/rabota/web/static/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control $rabota_static_cache always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # загруженные файлы (логотипы и т.п.). Копии фото Telegram (data/media) сюда не входят и наружу не отдаются
    location /media/ {
        alias <PROJECT_DIR>/media/;
        try_files $uri =404;
        autoindex off;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    }

    # проверки здоровья
    location = /healthz {
        access_log off;
        proxy_pass http://rabota_app;
    }
    location = /healthz/deep {
        limit_req zone=rabota_health burst=5 nodelay;
        access_log off;
        proxy_pass http://rabota_app;
    }

    # вход, регистрация, сброс пароля: самые жёсткие лимиты (только POST)
    location ~ ^/(login|register|forgot|reset/|verify/resend) {
        limit_req zone=rabota_pages burst=60 nodelay;
        limit_req zone=rabota_auth burst=5 nodelay;
        proxy_pass http://rabota_app;
    }

    # админка. Чтобы пустить только свои адреса, раскомментируйте allow/deny (адрес посетителя настоящий, из PROXY)
    location ^~ /admin {
        # allow 203.0.113.10;
        # deny all;
        limit_req zone=rabota_pages burst=60 nodelay;
        limit_req zone=rabota_auth burst=10 nodelay;
        proxy_pass http://rabota_app;
    }

    # всё остальное: приложение. POST в формах (отклики, жалобы, обращения, сообщения, кабинет) ограничены
    location / {
        limit_req zone=rabota_pages burst=60 nodelay;
        limit_req zone=rabota_forms burst=15 nodelay;
        proxy_pass http://rabota_app;
    }

    # общие параметры проксирования (наследуются во всех location с proxy_pass)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # перезаписываем, а не дописываем: клиент не может подсунуть чужой адрес в X-Forwarded-For
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
}
