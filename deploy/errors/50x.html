<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="30">
  <title>Сайт временно недоступен | Работа Донецк</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f8fc; --surface: #ffffff; --ink: #14203a; --ink-2: #4a5878; --line: #dbe2ef; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --surface: #111c33; --ink: #e2e8f4; --ink-2: #a3b1cc; --line: #24324f; --accent: #5b8def; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1rem; background: var(--bg); color: var(--ink);
           font: 1.0625rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { width: min(32rem, 100%); padding: 2rem 1.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; line-height: 1.2; }
    p { margin: 0 0 1rem; color: var(--ink-2); }
    a.btn { display: inline-block; padding: .75rem 1.25rem; border-radius: .75rem; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
    a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Сайт временно недоступен</h1>
    <p>Мы уже знаем о проблеме или обновляем сайт. Обычно это занимает несколько минут. Страница обновится сама.</p>
    <a class="btn" href="/">Попробовать снова</a>
  </main>
</body>
</html>
