<html><body><template id="HH-Lux-InitialState">{&quot;vacancyView&quot;: {&quot;vacancyFull&quot;: {&quot;vacancy&quot;: {&quot;vacancyId&quot;: 134290618, &quot;name&quot;: &quot;Оператор call-центра&quot;, &quot;description&quot;: &quot;&lt;p&gt;&lt;strong&gt;ZebraCall &lt;/strong&gt;— один из ведущих онлайн-колл-центров в сфере интернет-продаж. Мы сотрудничаем более чем с 50 категориями товаров: от средств для здоровья до товаров для дома и сада. За 5 лет мы выросли до 600 сотрудников и продолжаем расти!&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Что мы предлагаем?&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Понятная и справедливая система оплаты &lt;strong&gt;(оклад + cистема KPI)&lt;/strong&gt;.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Удаленная работа&lt;/strong&gt; из дома (любая страна и город)&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Комфортный график&lt;/strong&gt; работы для сохранения баланса жизни (5/2 или 2/2 со сменой от 8 часов).&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Повышенные бонусы&lt;/strong&gt; за каждый оформленный товар&lt;/li&gt; &lt;li&gt;Возможность &lt;strong&gt;работы с любимыми продуктами &lt;/strong&gt;из нашего ассортимента&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Надбавки&lt;/strong&gt; за эффективность и за выполнение планов&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Бесплатное обучение&lt;/strong&gt; и тренинги&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Карьерный рост&lt;/strong&gt;, ты можешь реализовать себя в любом интересном для тебя направлении, так как компания постоянно расширяется. Кстати, 85% руководителей отделов у нас начинали именно с позиции оператора&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Дополнительные бонусы:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Выплаты за отпуск&lt;/li&gt; &lt;li&gt;Бонус &amp;quot;Подарок на день рождения&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Как происходит продажа на данном проекте?&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Работа с уже существующей базой, никакого поиска клиентов&lt;/li&gt; &lt;li&gt;Формирование
