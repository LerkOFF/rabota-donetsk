[project]
name = "rabota-donetsk"
version = "0.1.0"
description = "Агрегатор вакансий Донецка и ДНР"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "pillow>=10",
  "imagehash>=4.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6", "respx>=0.21", "playwright>=1.47", "pytest-playwright>=0.5", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.setuptools]
packages = ["rabota"]
